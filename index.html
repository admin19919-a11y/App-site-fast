<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Карьер Пистали</title>
  <meta name="theme-color" content="#f0a500" />
  <meta name="description" content="Диспетчерское управление карьером Пистали: экскаваторы, самосвалы, рейсы, тоннаж, ротация водителей." />

  <!-- PWA: манифест и иконки -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Пистали" />

  <!-- Шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; background: #0f1923; font-family: 'Inter', system-ui, sans-serif; }
    #root { min-height: 100vh; }
    #boot-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: #0f1923; color: #94a3b8; font-size: 13px; z-index: 9999; }
  </style>

  <!--
    ─── Карта импортов (import map) ───────────────────────────────────────
    app.js — это уже ГОТОВЫЙ, предварительно скомпилированный код
    (JSX превращён в обычный JS заранее, не в браузере). Браузеру остаётся
    только скачать и выполнить его — загрузка в разы быстрее, чем через
    Babel-в-браузере.
    Если App.jsx поменяется — просто пересоберите app.js заново (попросите
    Claude прислать новую версию) и замените файл на хостинге.
  -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "xlsx": "https://esm.sh/xlsx@0.18.5",
      "tesseract.js": "https://esm.sh/tesseract.js@5.1.0"
    }
  }
  </script>
</head>
<body>
  <div id="root">
    <div id="boot-loader">
      <div style="font-size:40px;">⛏️</div>
      <div>Загрузка «Карьер Пистали»...</div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>

  <!-- Регистрация Service Worker: ускоряет повторную загрузку и даёт офлайн-работу -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
